<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="isHandset() ? 'dialog' : 'navigation'"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <mat-toolbar class="sidenav-header">
      <div class="logo-title">
        <img src="favicon.svg" alt="Worth It" class="app-logo" width="28" height="28" />
        <span class="app-title">Worth It</span>
      </div>
      <span class="spacer"></span>
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.close()" aria-label="Close navigation">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-toolbar>

    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active-link"
          class="nav-list-item"
          (click)="isHandset() ? drawer.close() : null"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <mat-toolbar color="primary" class="top-toolbar">
      @if (isHandset()) {
        <button
          type="button"
          aria-label="Toggle navigation"
          mat-icon-button
          (click)="drawer.toggle()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="page-title">{{ pageTitle() }}</span>
      <span class="spacer"></span>

      <mat-chip-set aria-label="Total Wealth" class="wealth-chip-set">
        <mat-chip class="wealth-chip" highlighted>
          <mat-icon matChipAvatar>account_balance_wallet</mat-icon>
          <span class="wealth-label">Wealth:</span>
          <span class="wealth-amount">
            {{ store.wealthSummary().totalWealth | money }}
          </span>
        </mat-chip>
      </mat-chip-set>
    </mat-toolbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
