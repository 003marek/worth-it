<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="48%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="disc-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="disc-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#091128" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#93c5fd" stroke-opacity="0.28" stroke-width="4" />
  <!-- Layered glassmorphic medallion rings -->
  <circle cx="256" cy="256" r="168" fill="url(#disc-outer)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6" />
  <circle cx="256" cy="256" r="110" fill="url(#disc-inner)" stroke="#ffffff" stroke-opacity="0.38" stroke-width="6" />
  <circle cx="256" cy="256" r="52" fill="#3b82f6" fill-opacity="0.38" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6" />
  <!-- Unified rising trend arrow -->
  <g filter="url(#shadow)">
    <path d="M120 356 L220 256 L278 308 L392 168" fill="none" stroke="url(#arrow)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M312 168 L392 168 L392 248" fill="none" stroke="url(#arrow)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
