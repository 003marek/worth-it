<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Target ring / coin outline -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-width="20" opacity="0.25" />
  <circle cx="256" cy="256" r="88" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.4" />
  <!-- Upward trend arrow -->
  <path d="M144 360 L240 264 L304 328 L400 184" fill="none" stroke="url(#arrow)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  <!-- Arrow head -->
  <path d="M328 176 L408 176 L408 256" fill="none" stroke="url(#arrow)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  <!-- Target center point -->
  <circle cx="256" cy="256" r="20" fill="#ffffff" filter="url(#shadow)" />
</svg>
